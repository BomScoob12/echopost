version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./script/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=your_username
      - MONGO_INITDB_ROOT_PASSWORD=your_password
      - MONGO_INITDB_DATABASE=echopost-db

  minio:
    image: minio/minio:latest
    container_name: echopost-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=your_minio_access_key
      - MINIO_ROOT_PASSWORD=your_minio_secret_key
      - MINIO_DEFAULT_BUCKET=echopost-bucket
    volumes:
      - minio_data:/data

volumes:
  mongodb_data:
  minio_data:

networks:
  mongodb_network:
    driver: bridge
